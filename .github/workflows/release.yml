name: Release

# Manual only: nothing here runs on push. Two ways to start it:
#
#   gh workflow run release.yml --ref main
#     Dry run (the default). Both targets are tested, built, smoke-tested and
#     packaged; nothing is tagged or published.
#
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
#     Release. The same jobs, then, only if every one of them passed, the tag
#     and the GitHub release are created at the tested commit.
#
# Release notes are the version's section of CHANGELOG.md, written by hand
# before the run. Go has no version file: the tag is the version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "vX.Y.Z to release, or dry-run to test and build every target and publish nothing"
        required: true
        default: dry-run

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publishing: ${{ steps.plan.outputs.publishing }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan
        id: plan
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::run this workflow on main (--ref main), not $REF"
            exit 1
          fi
          if [ "$TAG" = dry-run ]; then
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            echo "version=dry-run-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "dry run at $GITHUB_SHA: nothing will be published"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vX.Y.Z or dry-run, got $TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; a release never moves a tag"
            exit 1
          fi
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [${TAG#v}] section for the release notes"
            exit 1
          fi
          echo "publishing=true" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # arm64 test and smoke binaries run under qemu: GitHub's arm64 runners
      # are not free for private repositories. qemu-user-static registers
      # binfmt_misc, so the kernel runs arm64 executables transparently.
      - name: Install qemu for arm64
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/aaa .

      # The released binary itself: version, capture, list, JSON and skill.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/aaa-data"
          ./dist/aaa --version | grep -F "$VERSION"
          ./dist/aaa smoke test item
          ./dist/aaa | grep -F "smoke test item"
          ./dist/aaa --json | grep -F '"open":1'
          ./dist/aaa --skill | grep -qx 'name: aaa'

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="aaa-$VERSION-linux-$GOARCH"
          cp LICENSE README.md dist/
          tar -C dist -czf "$name.tar.gz" aaa LICENSE README.md
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Keep the package for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aaa-linux-${{ matrix.arch }}
          path: aaa-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publishing == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The tag is created here, at the commit every job tested, never before.
      - name: Create the tag and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if previous="$(gh release view --json tagName -q .tagName 2>/dev/null)"; then
            printf '\n**Full changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' \
              "$previous" "$TAG" "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          fi
          ls -l dist
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
